name: Version Bump Comment

on:
  pull_request:

jobs:
  version-bump-comment:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    strategy:
      matrix:
        node-version: [24]

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Check if files other than songs folder changed
        id: changed-files
        uses: tj-actions/changed-files@v47.0.1
        with:
          files: |
            !songs/**
            !dist/**

      - name: Debug changed files
        run: |
          echo "Changed files: ${{ steps.changed-files.outputs.all_changed_files }}"

      - name: Setup Node.js ${{ matrix.node-version }}
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: actions/setup-node@v6.1.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Get current version number
        if: steps.changed-files.outputs.any_changed == 'true'
        id: version
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          echo "version=$CURRENT_VERSION" >> $GITHUB_OUTPUT

          IFS='.' read -r -a VERSION_PARTS <<< "$CURRENT_VERSION"
          MAJOR="${VERSION_PARTS[0]}"
          MINOR="${VERSION_PARTS[1]}"
          PATCH="${VERSION_PARTS[2]}"

          PATCH_VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
          MINOR_VERSION="$MAJOR.$((MINOR + 1)).0"
          MAJOR_VERSION="$((MAJOR + 1)).0.0"

          echo "patch=$PATCH_VERSION" >> $GITHUB_OUTPUT
          echo "minor=$MINOR_VERSION" >> $GITHUB_OUTPUT
          echo "major=$MAJOR_VERSION" >> $GITHUB_OUTPUT

      - name: Get base branch version
        if: steps.changed-files.outputs.any_changed == 'true'
        id: base-version
        run: |
          BASE_REF="${{ github.event.pull_request.base.ref }}"
          git fetch origin $BASE_REF

          BASE_VERSION=$(git show origin/$BASE_REF:package.json | node -p "JSON.parse(require('fs').readFileSync('/dev/stdin', 'utf8')).version")
          echo "version=$BASE_VERSION" >> $GITHUB_OUTPUT
          echo "Base branch version: $BASE_VERSION"

      - name: Check if version already bumped in any commit
        if: steps.changed-files.outputs.any_changed == 'true'
        id: version-check
        run: |
          BASE_REF="${{ github.event.pull_request.base.ref }}"
          git fetch origin $BASE_REF
          BASE_VERSION=$(git show origin/$BASE_REF:package.json | node -p "JSON.parse(require('fs').readFileSync('/dev/stdin', 'utf8')).version")
          COMMITS=$(git rev-list origin/$BASE_REF..HEAD)

          ALREADY_BUMPED=false
          for COMMIT in $COMMITS; do
            COMMIT_VERSION=$(git show $COMMIT:package.json | node -p "JSON.parse(require('fs').readFileSync('/dev/stdin', 'utf8')).version")
            if [ "$COMMIT_VERSION" != "$BASE_VERSION" ]; then
              ALREADY_BUMPED=true
              echo "Version already bumped in commit $COMMIT: $BASE_VERSION -> $COMMIT_VERSION"
              break
            fi
          done

          echo "already_bumped=$ALREADY_BUMPED" >> $GITHUB_OUTPUT

      - name: Check for existing bot comment
        if: steps.changed-files.outputs.any_changed == 'true' || steps.version-check.outputs.already_bumped == 'false'
        id: comment
        uses: peter-evans/find-comment@v4.0.0
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: 'Version Bump Required'

      - name: Create or update comment
        if: steps.changed-files.outputs.any_changed == 'true' || steps.version-check.outputs.already_bumped == 'false'
        uses: peter-evans/create-or-update-comment@v5.0.0
        with:
          comment-id: ${{ steps.comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          edit-mode: replace
          body: |
            ## Version Bump Required

            This PR contains changes to other files than songs and requires a version bump. 

            To bump the version current version (`${{ steps.version.outputs.version }}`), comment with:
            - `/version patch` → **Patch** (bug fix): `${{ steps.version.outputs.patch }}`
            - `/version minor` → **Minor** (enhancement/feature): `${{ steps.version.outputs.minor }}`
            - `/version major` → **Major** (breaking change): `${{ steps.version.outputs.major }}`

            Once commented, the version will be automatically updated in `package.json`.  
            _Only the PR author and repository maintainers can trigger the version bump._
