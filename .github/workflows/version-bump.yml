name: Auto Version Bump

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

jobs:
  # Job 1: Comment on PR asking for version bump type
  request-version-bump:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v44

      - name: Check if only songs folder changed
        id: check-songs-only
        run: |
          CHANGED_FILES="${{ steps.changed-files.outputs.all_changed_files }}"
          ONLY_SONGS=true

          for file in $CHANGED_FILES; do
            if [[ ! "$file" =~ ^songs/ ]]; then
              ONLY_SONGS=false
              break
            fi
          done

          echo "only_songs=$ONLY_SONGS" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        if: steps.check-songs-only.outputs.only_songs == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Get current version
        if: steps.check-songs-only.outputs.only_songs == 'false'
        id: current-version
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          echo "version=$CURRENT_VERSION" >> $GITHUB_OUTPUT

          IFS='.' read -r -a VERSION_PARTS <<< "$CURRENT_VERSION"
          MAJOR="${VERSION_PARTS[0]}"
          MINOR="${VERSION_PARTS[1]}"
          PATCH="${VERSION_PARTS[2]}"

          PATCH_VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
          MINOR_VERSION="$MAJOR.$((MINOR + 1)).0"
          MAJOR_VERSION="$((MAJOR + 1)).0.0"

          echo "patch=$PATCH_VERSION" >> $GITHUB_OUTPUT
          echo "minor=$MINOR_VERSION" >> $GITHUB_OUTPUT
          echo "major=$MAJOR_VERSION" >> $GITHUB_OUTPUT

      - name: Check for existing bot comment
        if: steps.check-songs-only.outputs.only_songs == 'false'
        id: find-comment
        uses: peter-evans/find-comment@v3
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: '📦 Version Bump Required'

      - name: Create or update comment
        if: steps.check-songs-only.outputs.only_songs == 'false'
        id: create-comment
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          edit-mode: replace
          body: |
            ## 📦 Version Bump Required

            This PR contains changes outside the `/songs` folder and requires a version bump.

            **Current version:** `${{ steps.current-version.outputs.version }}`

            **To bump the version, reply to this comment with:**
            - `/version patch` → **Patch** (bug fix): `${{ steps.current-version.outputs.patch }}`
            - `/version minor` → **Minor** (enhancement/feature): `${{ steps.current-version.outputs.minor }}`
            - `/version major` → **Major** (breaking change): `${{ steps.current-version.outputs.major }}`

            Once you comment, the version will be automatically updated in `package.json`.

            _Only the PR author or repository maintainers can trigger the version bump._

  # Job 2: Process version bump command
  process-version-command:
    if: github.event_name == 'issue_comment'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Check if comment is on PR and contains /version
        id: check-trigger
        run: |
          if [[ "${{ github.event.issue.pull_request }}" != "" ]] && [[ "${{ github.event.comment.body }}" == *"/version"* ]]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
            echo "This is a PR comment with /version command"
          else
            echo "should_run=false" >> $GITHUB_OUTPUT
            echo "Not a PR comment or missing /version command"
          fi

          echo "Is PR: ${{ github.event.issue.pull_request != '' }}"
          echo "Comment body: ${{ github.event.comment.body }}"

      - name: Debug event payload
        if: steps.check-trigger.outputs.should_run == 'true'
        run: |
          echo "Event name: ${{ github.event_name }}"
          echo "Comment body: ${{ github.event.comment.body }}"
          echo "Comment author: ${{ github.event.comment.user.login }}"
          echo "Issue number: ${{ github.event.issue.number }}"

      - name: Get PR details
        if: steps.check-trigger.outputs.should_run == 'true'
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            return pr.data;

      - name: Check if user is authorized
        if: steps.check-trigger.outputs.should_run == 'true'
        id: check-auth
        uses: actions/github-script@v7
        with:
          script: |
            const commentAuthor = context.payload.comment.user.login;
            const prAuthor = '${{ fromJson(steps.pr.outputs.result).user.login }}';

            // Check if user is PR author
            if (commentAuthor === prAuthor) {
              return { authorized: true, user: commentAuthor };
            }

            // Check if user has write/maintain/admin permission
            try {
              const permission = await github.rest.repos. getCollaboratorPermissionLevel({
                owner: context. repo.owner,
                repo: context.repo.repo,
                username: commentAuthor
              });
              
              const permLevel = permission.data.permission;
              if (['write', 'maintain', 'admin'].includes(permLevel)) {
                return { authorized: true, user: commentAuthor };
              }
            } catch (error) {
              console.log(`Could not check permissions for ${commentAuthor}`);
            }

            return { authorized: false, user: commentAuthor };

      - name: Set auth output
        if: steps.check-trigger.outputs.should_run == 'true'
        id: auth
        run: |
          echo "authorized=${{ fromJson(steps.check-auth.outputs.result).authorized }}" >> $GITHUB_OUTPUT
          echo "user=${{ fromJson(steps.check-auth.outputs.result).user }}" >> $GITHUB_OUTPUT

      - name: React with thumbs down if unauthorized
        if: steps.check-trigger.outputs.should_run == 'true' && steps.auth.outputs.authorized == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: '-1'
            });

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '⚠️ @${{ steps.auth.outputs. user }} - Only the PR author or repository maintainers can trigger version bumps.'
            });

      - name: Parse version command
        if: steps.check-trigger.outputs.should_run == 'true' && steps.auth.outputs.authorized == 'true'
        id: parse-command
        run: |
          COMMENT="${{ github.event.comment.body }}"

          if echo "$COMMENT" | grep -iq "/version major"; then
            echo "type=major" >> $GITHUB_OUTPUT
          elif echo "$COMMENT" | grep -iq "/version minor"; then
            echo "type=minor" >> $GITHUB_OUTPUT
          elif echo "$COMMENT" | grep -iq "/version patch"; then
            echo "type=patch" >> $GITHUB_OUTPUT
          else
            echo "type=invalid" >> $GITHUB_OUTPUT
          fi

      - name: React with thumbs down if invalid command
        if: steps.check-trigger.outputs.should_run == 'true' && steps.auth.outputs.authorized == 'true' && steps.parse-command.outputs.type == 'invalid'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: '-1'
            });

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '⚠️ Invalid command. Use `/version patch`, `/version minor`, or `/version major`.'
            });

      - name: Checkout PR branch
        if: steps.check-trigger.outputs.should_run == 'true' && steps.auth.outputs.authorized == 'true' && steps.parse-command.outputs.type != 'invalid'
        uses: actions/checkout@v4
        with:
          ref: ${{ fromJson(steps.pr.outputs. result).head.ref }}
          repository: ${{ fromJson(steps. pr.outputs.result).head.repo.full_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        if: steps.check-trigger.outputs.should_run == 'true' && steps.auth.outputs.authorized == 'true' && steps.parse-command.outputs.type != 'invalid'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check for existing version bump commit
        if: steps. check-trigger.outputs.should_run == 'true' && steps.auth.outputs.authorized == 'true' && steps.parse-command.outputs.type != 'invalid'
        id: check-existing
        run: |
          # Check if there's already a version bump commit by the bot
          BUMP_COMMIT=$(git log --author="github-actions\[bot\]" --grep="^chore: bump version to" --format="%H" -n 1)

          if [ -n "$BUMP_COMMIT" ]; then
            echo "existing_commit=$BUMP_COMMIT" >> $GITHUB_OUTPUT
            echo "has_existing=true" >> $GITHUB_OUTPUT
            echo "Found existing version bump commit:  $BUMP_COMMIT"
          else
            echo "has_existing=false" >> $GITHUB_OUTPUT
            echo "No existing version bump commit found"
          fi

      - name: Reset to remove existing version bump
        if: steps.check-trigger.outputs.should_run == 'true' && steps.auth. outputs.authorized == 'true' && steps.parse-command.outputs.type != 'invalid' && steps.check-existing.outputs. has_existing == 'true'
        run: |
          echo "Removing existing version bump commit(s)"

          # Find the commit before the version bump
          BUMP_COMMIT="${{ steps.check-existing.outputs.existing_commit }}"
          PARENT_COMMIT=$(git rev-parse ${BUMP_COMMIT}^)

          # Reset to the parent commit (before version bump)
          git reset --hard $PARENT_COMMIT

          echo "Reset to commit: $PARENT_COMMIT"

      - name: Get base branch version
        if: steps. check-trigger.outputs.should_run == 'true' && steps.auth.outputs.authorized == 'true' && steps.parse-command.outputs.type != 'invalid'
        id: base-version
        run: |
          # Get the base branch name
          BASE_REF="${{ fromJson(steps.pr. outputs.result).base.ref }}"

          # Fetch the base branch
          git fetch origin $BASE_REF

          # Get version from base branch
          BASE_VERSION=$(git show origin/$BASE_REF:package. json | node -p "JSON.parse(require('fs').readFileSync('/dev/stdin', 'utf8')).version")

          echo "version=$BASE_VERSION" >> $GITHUB_OUTPUT
          echo "Base branch version: $BASE_VERSION"

      - name: Calculate new version
        if: steps. check-trigger.outputs.should_run == 'true' && steps.auth.outputs.authorized == 'true' && steps.parse-command.outputs.type != 'invalid'
        id: new-version
        run: |
          BUMP_TYPE="${{ steps.parse-command.outputs.type }}"
          BASE_VERSION="${{ steps.base-version.outputs.version }}"

          IFS='.' read -r -a VERSION_PARTS <<< "$BASE_VERSION"
          MAJOR="${VERSION_PARTS[0]}"
          MINOR="${VERSION_PARTS[1]}"
          PATCH="${VERSION_PARTS[2]}"

          if [ "$BUMP_TYPE" = "major" ]; then
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
          elif [ "$BUMP_TYPE" = "minor" ]; then
            MINOR=$((MINOR + 1))
            PATCH=0
          elif [ "$BUMP_TYPE" = "patch" ]; then
            PATCH=$((PATCH + 1))
          fi

          NEW_VERSION="$MAJOR.$MINOR.$PATCH"

          echo "old=$BASE_VERSION" >> $GITHUB_OUTPUT
          echo "new=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "Calculated new version: $BASE_VERSION → $NEW_VERSION"

      - name: Update package.json version
        if: steps.check-trigger.outputs.should_run == 'true' && steps.auth.outputs.authorized == 'true' && steps.parse-command. outputs.type != 'invalid'
        run: |
          NEW_VERSION="${{ steps.new-version.outputs.new }}"
          npm version $NEW_VERSION --no-git-tag-version
          echo "Updated package.json to version $NEW_VERSION"

      - name: Commit and push version bump
        if: steps.check-trigger.outputs.should_run == 'true' && steps. auth.outputs.authorized == 'true' && steps.parse-command.outputs.type != 'invalid'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore: bump version to ${{ steps.new-version.outputs. new }}"

          # Force push if we removed an existing commit
          if [ "${{ steps.check-existing.outputs. has_existing }}" = "true" ]; then
            echo "Force pushing to replace previous version bump"
            git push --force-with-lease
          else
            echo "Pushing new version bump"
            git push
          fi

      - name: React with success and comment
        if: steps.check-trigger.outputs.should_run == 'true' && steps.auth.outputs.authorized == 'true' && steps.parse-command. outputs.type != 'invalid'
        uses: actions/github-script@v7
        with:
          script: |
            // React with rocket to the command
            await github.rest.reactions.createForIssueComment({
              owner: context.repo. owner,
              repo: context. repo.repo,
              comment_id: context.payload.comment. id,
              content: 'rocket'
            });

            const wasReplaced = '${{ steps.check-existing.outputs.has_existing }}' === 'true';
            const message = wasReplaced 
              ? '✅ **Version bump updated by @${{ steps.auth.outputs. user }}! ** `${{ steps.new-version. outputs.old }}` → `${{ steps.new-version.outputs.new }}`\n\n_Previous version bump was replaced._'
              : '✅ **Version bumped by @${{ steps.auth.outputs.user }}!** `${{ steps.new-version.outputs. old }}` → `${{ steps.new-version.outputs.new }}`';

            // Post success comment
            await github.rest. issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: message
            });
